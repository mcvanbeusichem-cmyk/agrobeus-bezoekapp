<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Deelbare QR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #cfd2c8; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .vellen { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px; }

  .vel {
    position: relative;
    overflow: hidden;
    background: #fbfaf4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #2b3626;
  }
  .vel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(75% 50% at 50% 0%, #ffffff 0%, #f0eee2 72%);
  }
  .vel > * { position: relative; z-index: 1; }
  .vel::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 18px;
    background: linear-gradient(90deg, #405038 0%, #56684a 55%, #8b8f4e 100%);
    z-index: 2;
  }

  .post { width: 1080px; height: 1080px; gap: 46px; padding: 76px; }
  .story { width: 1080px; height: 1920px; gap: 70px; padding: 120px 76px 150px; }

  .logo { display: block; }
  .post .logo { width: 340px; }
  .story .logo { width: 460px; }

  .qr-kader {
    background: #fff;
    border-radius: 26px;
    box-shadow: 0 26px 60px -34px rgba(43,54,38,.65);
  }
  .post .qr-kader { width: 430px; padding: 26px; }
  .story .qr-kader { width: 620px; padding: 34px; }
  .qr-kader svg { width: 100%; height: auto; display: block; }

  .aanwijzing { font-weight: 600; letter-spacing: .01em; color: #405038; }
  .post .aanwijzing { font-size: 40px; }
  .story .aanwijzing { font-size: 56px; }

  .sub { margin-top: 14px; font-size: 26px; letter-spacing: .04em; color: #6f7566; }
  .story .sub { font-size: 34px; }

  .domein { letter-spacing: .3em; text-transform: uppercase; color: #8b8f4e; font-weight: 700; }
  .post .domein { font-size: 26px; }
  .story .domein { font-size: 34px; }
</style></head>
