<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Agrovitae visitekaartje</title>
<style>
  /* ===================================================================
     VISITEKAARTJE AGROVITAE
     Trim 85 x 55 mm  |  Afloop 3 mm  |  Totaal 91 x 61 mm
     Veilige zone: 5 mm binnen de snijlijn
     Kleuren komen uit het logo: #405038 groen, #8b8f4e olijf
     =================================================================== */

  :root {
    --groen-diep:  #2b3626;
    --groen:       #405038;
    --mos:         #56684a;
    --olijf:       #8b8f4e;
    --zand:        #f2f0e6;
    --room:        #fbfaf4;
    --grijs:       #6f7566;

    --bleed: 3mm;
    --trim-b: 85mm;
    --trim-h: 55mm;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #d7d9d0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: var(--groen-diep);
    -webkit-font-smoothing: antialiased;
  }

  .werkblad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14mm;
    padding: 14mm 0;
  }

  .kaart {
    position: relative;
    width: calc(var(--trim-b) + 2 * var(--bleed));
    height: calc(var(--trim-h) + 2 * var(--bleed));
    overflow: hidden;
    background: #fff;
  }

  /* Snijlijn-indicatie, alleen zichtbaar op het scherm */
  .snijlijn {
    position: absolute;
    inset: var(--bleed);
    border: 0.2mm dashed rgba(0,0,0,.28);
    pointer-events: none;
    z-index: 50;
  }

  .inhoud {
    position: absolute;
    inset: calc(var(--bleed) + 5mm);
    z-index: 10;
  }

  /* ---------- VOORKANT ---------- */

  .voor { background: var(--room); }

  .voor .veld {
    position: absolute;
    inset: 0;
    background: radial-gradient(115% 85% at 50% 8%, #ffffff 0%, var(--zand) 78%);
  }

  .voor .zoom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5mm;
    background: linear-gradient(90deg, var(--groen) 0%, var(--mos) 58%, var(--olijf) 100%);
  }

  .voor .inhoud {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.6mm;
  }

  .voor img {
    width: 42mm;
    height: auto;
    display: block;
  }

  .domein {
    font-size: 2.6mm;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--mos);
  }

  /* ---------- ACHTERKANT ---------- */

  .achter { background: var(--groen-diep); color: var(--room); }

  .achter .veld {
    position: absolute;
    inset: 0;
    background: radial-gradient(125% 105% at 88% 112%, #3b4a33 0%, var(--groen-diep) 60%);
  }

  .achter .merk-watermerk {
    position: absolute;
    right: -8mm;
    top: -9mm;
    width: 40mm;
    opacity: .085;
    filter: grayscale(1) brightness(3);
  }

  .achter .inhoud {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .persoon .pnaam {
    font-size: 5mm;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff;
  }

  .persoon .rol {
    margin-top: 1.2mm;
    font-size: 2.6mm;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--olijf);
  }

  .streep {
    width: 10mm;
    height: 0.6mm;
    background: var(--olijf);
    margin: 2.6mm 0;
  }

  .gegevens {
    display: flex;
    flex-direction: column;
    gap: 1.5mm;
  }

  .regel {
    display: flex;
    align-items: center;
    gap: 1.8mm;
    font-size: 2.85mm;
    line-height: 1.2;
    white-space: nowrap;
    color: #eceee4;
  }

  .regel svg { width: 3.2mm; height: 3.2mm; flex: none; color: var(--olijf); }

  .voet {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 2.2mm;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,.42);
  }

  /* ---------- PRINT ---------- */

  @page { size: 91mm 61mm; margin: 0; }

  @media print {
    body { background: #fff; }
    .werkblad { gap: 0; padding: 0; }
    .snijlijn, .schermtitel { display: none !important; }
    .kaart {
      break-after: page;
      page-break-after: always;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    .kaart:last-child { break-after: auto; page-break-after: auto; }
  }

  .schermtitel {
    font-size: 3mm;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #5d6857;
  }
</style>
</head>
<body>
<div class="werkblad">

  <div class="schermtitel">Voorkant &nbsp;&middot;&nbsp; 85 &times; 55 mm &nbsp;&middot;&nbsp; 3 mm afloop</div>

  <!-- ============ VOORKANT ============ -->
  <div class="kaart voor">
    <div class="veld"></div>
    <div class="zoom"></div>
    <div class="inhoud">
      <img src="agrovitae-logo.png" alt="Agrovitae, bladmeststoffen en biostimulanten">
      <div class="domein" data-veld="web">www.agrovitae.eu</div>
    </div>
    <div class="snijlijn"></div>
  </div>

  <div class="schermtitel">Achterkant</div>

  <!-- ============ ACHTERKANT ============ -->
  <div class="kaart achter">
    <div class="veld"></div>
    <img class="merk-watermerk" src="agrovitae-merk.png" alt="">
    <div class="inhoud">

      <div class="persoon">
        <div class="pnaam" data-veld="naam">Marco van Beusichem</div>
        <div class="rol" data-veld="functie">Bladmeststoffen &amp; biostimulanten</div>
        <div class="streep"></div>
      </div>

      <div class="gegevens">
        <div class="regel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
          <span data-veld="telefoon">+31 6 54950432</span>
        </div>
        <div class="regel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          <span data-veld="email">info@agrovitae.eu</span>
        </div>
        <div class="regel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span data-veld="adres">Hoofdstraat 49, 4041 AB Kesteren</span>
        </div>
        <div class="regel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></svg>
          <span data-veld="web2">www.agrovitae.eu</span>
        </div>
      </div>

      <div class="voet">
        <span data-veld="kvk">KVK 88547392</span>
        <span data-veld="land">Nederland</span>
      </div>

    </div>
    <div class="snijlijn"></div>
  </div>

</div>
</body>
</html>
